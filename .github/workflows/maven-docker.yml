
name: Maven Docker CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build
        run: mvn -B clean package -DskipTests

      - name: Diagnose Dockerfile Location
        run: |
          echo "Current directory:"
          pwd
          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"
          echo "Workspace files:"
          ls -la "$GITHUB_WORKSPACE"
          echo "Git tracked files:"
          git ls-files

          if [ -f "$GITHUB_WORKSPACE/Dockerfile" ]; then
            echo "Dockerfile found!"
            wc -c "$GITHUB_WORKSPACE/Dockerfile"
            cat "$GITHUB_WORKSPACE/Dockerfile"
          else
            echo "ERROR: Dockerfile is missing!"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f
            exit 1
          fi

      - name: Docker Image Build
        run: |
          docker build \
            --file "$GITHUB_WORKSPACE/Dockerfile" \
            --tag maven-project:latest \
            "$GITHUB_WORKSPACE"

      - name: Verify Docker Image
        run: docker images maven-project:latest

      - name: Pipeline Success
        run: echo "Maven and Docker CI completed successfully!"

