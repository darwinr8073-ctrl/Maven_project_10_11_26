
name: Maven Docker CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build
        run: mvn -B clean package -DskipTests

      - name: Docker Image Build
        run: docker build -t maven-project:latest .

      - name: Verify Docker Image
        run: docker images maven-project:latest

      - name: Pipeline Success
        run: echo "Maven and Docker CI completed successfully!"

